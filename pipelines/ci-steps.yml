# Passos de CI compartilhados pelo pipeline de PR e pelo da main (seção 2.3.1, passo 2).
# PostgreSQL efêmero: o que já vem instalado na imagem Ubuntu do agente Microsoft-hosted (sem Docker,
# sem nenhum recurso do Azure). O banco existe só durante o job e some com o agente.
parameters:
- name: baseRef          # 'pr' = branch de destino do PR; ou uma ref explícita (ex.: HEAD~1)
  type: string
  default: pr

steps:
- checkout: self
  fetchDepth: 0           # histórico completo: o guardrail compara com a branch de destino
  displayName: 'Checkout (histórico completo)'

- bash: |
    set -euo pipefail
    if [ "${{ parameters.baseRef }}" = "pr" ]; then
      # fora de um PR (execução manual), compara com a main
      ALVO="${SYSTEM_PULLREQUEST_TARGETBRANCH:-refs/heads/main}"
      B="origin/${ALVO#refs/heads/}"
    else
      B="${{ parameters.baseRef }}"
    fi
    if ! git rev-parse --verify --quiet "$B^{commit}" >/dev/null; then
      echo "##vso[task.logissue type=warning]Base $B inexistente (primeiro commit?): comparando com HEAD."
      B=HEAD
    fi
    echo "Base de comparação das migrations: $B"
    echo "##vso[task.setvariable variable=BASE_REF]$B"
  displayName: 'Define a base de comparação'

- bash: |
    set -euo pipefail
    sudo systemctl start postgresql.service
    pg_isready -h 127.0.0.1 -t 30
    sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE lab_ci LOGIN PASSWORD 'lab_ci'"
    sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE lab_dba_testing OWNER lab_ci"
    sudo -u postgres psql -tAc "SELECT version()"
  displayName: 'PostgreSQL efêmero (banco de testes isolado)'

- bash: |
    set -euo pipefail
    php -v | head -1
    php -r 'exit(extension_loaded("pdo_pgsql") ? 0 : 1);' || { echo "pdo_pgsql ausente"; exit 1; }
    composer install --no-interaction --prefer-dist --no-progress
    cp .env.testing.example .env.testing
    echo "##vso[task.setvariable variable=DEPENDENCIAS_OK]true"
  displayName: 'composer install + .env.testing (sem credenciais de produção)'

- bash: php scripts/ci/classificar-migrations.php "$(BASE_REF)"
  displayName: 'Guardrail: imutabilidade e classificação de risco das migrations'

# Os passos abaixo rodam mesmo se o guardrail reprovar (desde que as dependências tenham sido
# instaladas), para registrar a evidência completa; o job continua falhando e o PR, bloqueado.
- bash: bash scripts/ci/sql-pendente.sh "$(BASE_REF)"
  condition: and(succeededOrFailed(), eq(variables['DEPENDENCIAS_OK'], 'true'))
  displayName: 'SQL pendente (migrate --pretend no estado anterior) + Squawk'

- bash: |
    set -euo pipefail
    php artisan migrate --env=testing --force --no-interaction
    php artisan migrate:status --env=testing
  condition: and(succeededOrFailed(), eq(variables['DEPENDENCIAS_OK'], 'true'))
  displayName: 'Aplica as migrations no banco efêmero'

- bash: php artisan test --env=testing --log-junit "$(Agent.TempDirectory)/junit.xml"
  condition: and(succeededOrFailed(), eq(variables['DEPENDENCIAS_OK'], 'true'))
  displayName: 'Testes de integração (PostgreSQL real, desde a versão inicial do esquema)'

- task: PublishTestResults@2
  condition: and(succeededOrFailed(), eq(variables['DEPENDENCIAS_OK'], 'true'))
  displayName: 'Publica resultado dos testes'
  inputs:
    testResultsFormat: JUnit
    testResultsFiles: '$(Agent.TempDirectory)/junit.xml'
    testRunTitle: 'lab-dba - testes de integração'
    failTaskOnMissingResultsFile: false
